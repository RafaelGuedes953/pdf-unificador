<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>PDF Unificador</title>
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%231f5eff'/%3E%3Cpath d='M20 14h18l8 8v28H20z' fill='%23fff'/%3E%3Cpath d='M38 14v8h8' fill='%23b9ccff'/%3E%3C/svg%3E"
    />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <header class="topbar">
      <h1>PDF Unificador</h1>
      <p class="hint" id="limits"></p>
      <p class="mode-note" id="mode-note" hidden>
        Modo no navegador: os arquivos são processados neste aparelho e não são enviados a nenhum servidor.
      </p>
    </header>

    <main>
      <section class="picker">
        <label class="btn primary" for="file-input">Adicionar arquivos</label>
        <input id="file-input" type="file" multiple accept="application/pdf,image/jpeg,image/png,image/webp" hidden />
        <p class="hint">PDF, JPG, PNG ou WebP. Arraste os cartões para reordenar.</p>
      </section>

      <p id="status" class="status" role="status" aria-live="polite" hidden></p>

      <ol id="pages" class="grid" aria-label="Páginas do PDF final"></ol>

      <p id="empty" class="empty">Nenhuma página ainda. Adicione arquivos para começar.</p>
    </main>

    <footer class="actionbar">
      <span id="count">0 páginas</span>
      <div class="actions">
        <button id="clear" class="btn" type="button" disabled>Limpar</button>
        <button id="generate" class="btn primary" type="button" disabled>Gerar PDF</button>
      </div>
    </footer>

    <script src="vendor/sortable/Sortable.min.js"></script>
    <script type="module" src="app.js"></script>
  </body>
</html>
