version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
    ignore:
      # O projeto está fixado no Node 22 (engines, README e CI). Troca de versão maior é decisão manual.
      - dependency-name: node
        update-types: ["version-update:semver-major"]
