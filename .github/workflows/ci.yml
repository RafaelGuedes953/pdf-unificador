name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # O nome do job (build-test) é o que a proteção da branch main exige.
  build-test:
    name: build-test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  # Garante que a imagem constrói nas duas arquiteturas (amd64 e arm64, a do Raspberry)
  # e que o container sobe e responde. O build arm64 roda emulado, então é o passo mais lento.
  docker-build:
    name: docker-build
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - name: Build amd64 (carrega no runner para o teste de fumaça)
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          load: true
          push: false
          tags: pdf-unificador:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Teste de fumaça
        run: |
          docker run -d --name smoke -p 3000:3000 pdf-unificador:ci
          for i in $(seq 1 20); do
            if curl -fsS http://localhost:3000/health; then echo; break; fi
            sleep 1
            if [ "$i" = "20" ]; then docker logs smoke; exit 1; fi
          done
          curl -fsS -o /dev/null http://localhost:3000/
          curl -fsS -o /dev/null http://localhost:3000/vendor/pdfjs/build/pdf.min.mjs
          docker rm -f smoke

      - name: Build arm64 (somente valida)
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/arm64
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
